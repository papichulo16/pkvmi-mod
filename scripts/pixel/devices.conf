# Pixel devices this workspace knows how to set up.
#
#   alias | kernel codename | release          | phones
#
# The kernel codename is the name Google uses in the kernel branch:
#   android-gs-<codename>-<release>   (on https://android.googlesource.com/kernel/manifest)
# `release` is <kernel version>-<android release>. Every device below currently
# ships its newest production kernel as 6.1-android16; when Google publishes a
# newer one (e.g. an android17 branch), change the release column or pass a
# branch name explicitly:  ./setup-device.sh pixel7 android-gs-pantah-<...>
#
# Codename -> phone names come from public branch/device naming, so treat the
# last column as a hint and check `getprop ro.product.device` on your phone.
#
# The pKVM hyp-module API is per kernel branch (6.1 here, 6.12 in ~/ack), so
# build against the branch that matches the phone, not against ~/ack.
#
# Adding a phone = adding a line. Devices sharing a codename share a kernel.

# Tensor G1 (gs101)
pixel6       | raviole     | 6.1-android16 | Pixel 6, 6 Pro (oriole, raven)
pixel6a      | bluejay     | 6.1-android16 | Pixel 6a (bluejay)

# Tensor G2 (gs201)
pixel7       | pantah      | 6.1-android16 | Pixel 7, 7 Pro (panther, cheetah)
pixel7a      | lynx        | 6.1-android16 | Pixel 7a (lynx)
pixelfold    | felix       | 6.1-android16 | Pixel Fold (felix)
pixeltablet  | tangorpro   | 6.1-android16 | Pixel Tablet (tangorpro)

# Tensor G3 (zuma)
pixel8       | shusky      | 6.1-android16 | Pixel 8, 8 Pro (shiba, husky)
pixel8a      | akita       | 6.1-android16 | Pixel 8a (akita)

# Tensor G4 (zumapro)
pixel9       | caimito     | 6.1-android16 | Pixel 9, 9 Pro, 9 Pro XL (tokay, caiman, komodo)
pixel9profold| comet       | 6.1-android16 | Pixel 9 Pro Fold (comet)
pixel9a      | tegu        | 6.1-android16 | Pixel 9a (tegu)
